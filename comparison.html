<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Compare AI tools side by side on pricing context, strengths, limitations, and source-backed notes."
    />
    <title>Compare AI Tools | AI Compass</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-shell">
        <a href="index.html" class="brand" aria-label="AI Compass home">✦ AI Compass</a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="tools.html">Tools</a>
          <a href="comparison.html" class="active">Compare</a>
          <a href="news.html">News</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="section page-head">
        <div class="container narrow">
          <span class="eyebrow">Comparison matrix</span>
          <h1>Compare AI tools</h1>
          <p class="page-intro">Choose up to three tools and review their primary strengths, limitations, and pricing context.</p>
        </div>
      </section>

      <section class="section">
        <div class="container narrow compare-selectors">
          <div class="selector-group">
            <label for="compare-tool-1">Tool 1</label>
            <select id="compare-tool-1" aria-label="Choose first tool"></select>
          </div>
          <div class="selector-group">
            <label for="compare-tool-2">Tool 2</label>
            <select id="compare-tool-2" aria-label="Choose second tool"></select>
          </div>
          <div class="selector-group">
            <label for="compare-tool-3">Tool 3</label>
            <select id="compare-tool-3" aria-label="Choose third tool"></select>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div id="compare-output" class="compare-panel" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-shell">
        <p>AI Compass — independent AI discovery and comparison.</p>
      </div>
    </footer>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        window.aiCompassApp && window.aiCompassApp.initComparisonPage();
      });
    </script>
  </body>
</html>
